name: CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        php-version: ['8.0', '8.1', '8.2', '8.3']
    
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: carbon
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: pdo_mysql, mbstring, curl, gd, dom, json
        coverage: none
    
    - name: Set permissions
      run: chmod 777 -R ./
    
    - name: Display PHP version
      run: php -v
    
    - name: Display PHP modules
      run: php -m
    
    - name: Install Composer dependencies
      run: |
        cd library
        composer install --no-interaction --prefer-dist
        cd ../
    
    - name: Start PHP built-in server (install)
      run: php -S 0.0.0.0:8080 &
    
    - name: Start PHP built-in server (main)
      run: php -S 0.0.0.0:8099 index.php &
    
    - name: Wait for servers to start
      run: sleep 5
    
    - name: Check PHP syntax
      run: |
        find ./ -type f -name "*.php" -print0 | while IFS= read -r -d '' file; do
          echo "Checking $file"
          php -l "$file"
        done
    
    - name: Run installation test
      run: php test-install.php
    
    - name: Run auto translate
      run: |
        cd language
        php auto_translate.php
        cd ../
    
    - name: Run main tests
      run: php test.php

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: pdo_mysql, mbstring, curl, gd, dom, json
    
    - name: Check for known vulnerabilities
      run: |
        cd library
        composer install --no-interaction --prefer-dist
        composer audit || true
        cd ../
